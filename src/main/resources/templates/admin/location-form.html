<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Food Location | Indiana Food Locator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar navbar-expand-lg border-bottom bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                Indiana Food Locator
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            Public Site
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/locations}">
                            Admin
                        </a>
                    </li>


                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="ms-3">

                            <button type="submit" class="btn btn-outline-secondary btn-sm">
                                Logout
                            </button>

                        </form>
                    </li>


                </ul>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h1 class="h3 mb-4" th:text="${foodLocation.id == null
            ? 'Add Food Location'
            : 'Edit Food Location'}">

                            Food Location
                        </h1>


                        <form th:action="${foodLocation.id == null}
        ? @{/admin/locations}
        : @{/admin/locations/{id}(id=${foodLocation.id})}" th:object="${foodLocation}" method="post">

                            <div class="row g-3">


                                <div class="col-md-8">

                                    <label class="form-label">
                                        Name
                                    </label>

                                    <input type="text" th:field="*{name}" class="form-control" required>

                                </div>


                                <div class="col-md-4">

                                    <label class="form-label">
                                        Category
                                    </label>

                                    <select th:field="*{category}" class="form-select" required>

                                        <option value="">
                                            Select Type
                                        </option>

                                        <option value="Food Pantry">
                                            Food Pantry
                                        </option>

                                        <option value="Soup Kitchen">
                                            Soup Kitchen
                                        </option>

                                        <option value="Meal Program">
                                            Meal Program
                                        </option>

                                        <option value="Mobile Pantry">
                                            Mobile Pantry
                                        </option>

                                    </select>

                                </div>


                                <div class="col-12">

                                    <label class="form-label">
                                        Address
                                    </label>

                                    <input type="text" th:field="*{address}" class="form-control" required>

                                </div>


                                <div class="col-md-5">

                                    <label class="form-label">
                                        City
                                    </label>

                                    <input type="text" th:field="*{city}" class="form-control" required>

                                </div>


                                <div class="col-md-3">

                                    <label class="form-label">
                                        State
                                    </label>

                                    <input type="text" th:field="*{state}" class="form-control" maxlength="2" value="IN"
                                        required>

                                </div>


                                <div class="col-md-4">

                                    <label class="form-label">
                                        ZIP Code
                                    </label>

                                    <input type="text" th:field="*{zipCode}" class="form-control" required>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Phone
                                    </label>

                                    <input type="text" th:field="*{phone}" class="form-control">

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Website
                                    </label>

                                    <input type="url" th:field="*{website}" class="form-control">

                                </div>


                                <div class="col-12">

                                    <label class="form-label">
                                        Hours
                                    </label>

                                    <input type="text" th:field="*{hours}" class="form-control">

                                </div>


                                <div class="col-12">

                                    <label class="form-label">
                                        Requirements
                                    </label>

                                    <textarea th:field="*{requirements}" class="form-control" rows="3">
                                </textarea>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Latitude
                                    </label>

                                    <input type="number" step="0.0000001" th:field="*{latitude}" class="form-control">

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Longitude
                                    </label>

                                    <input type="number" step="0.0000001" th:field="*{longitude}" class="form-control">

                                </div>


                                <div class="col-12">

                                    <div class="form-check">

                                        <input type="checkbox" th:field="*{active}" class="form-check-input">

                                        <label class="form-check-label">
                                            Active
                                        </label>

                                    </div>

                                </div>


                                <div class="col-12 mt-4">

                                    <button type="submit" class="btn btn-success">

                                        Save Location

                                    </button>

                                    <a th:href="@{/admin/locations}" class="btn btn-outline-secondary ms-2">

                                        Cancel

                                    </a>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="home-footer">

        <div class="container text-center">

            <p class="mb-1 fw-semibold">
                Indiana Food Locator
            </p>

            <p class="small mb-0">
                Helping Indiana residents connect with food assistance resources.
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
