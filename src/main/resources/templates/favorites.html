<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorites | Indiana Food Locator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar navbar-expand-lg border-bottom bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                Indiana Food Locator
            </a>

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/locations}">
                        Search
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">

                    <a class="nav-link" th:href="@{/favorites}">
                        Favorites
                    </a>

                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}">
                        Contact
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">

                    <a class="nav-link" th:href="@{/admin/locations}">
                        Admin
                    </a>

                </li>

                <li class="nav-item ms-lg-3" sec:authorize="isAnonymous()">

                    <a class="btn btn-outline-success" th:href="@{/login}">
                        Login
                    </a>

                </li>

                <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated()">

                    <form th:action="@{/logout}" method="post">

                        <button type="submit" class="btn btn-outline-secondary">
                            Logout
                        </button>

                    </form>

                </li>

            </ul>


        </div>

    </nav>


    <main class="container py-5">

        <div class="mb-4">

            <h1 class="h2">
                Saved Food Locations
            </h1>

            <p class="text-muted">
                Food assistance locations you have saved.
            </p>

        </div>


        <div th:if="${#lists.isEmpty(favorites)}" class="alert alert-info">

            You have not saved any food locations yet.

        </div>


        <div class="row g-4">

            <div class="col-lg-6" th:each="favorite : ${favorites}">

                <div class="card h-100 shadow-sm">

                    <div class="card-body">

                        <h2 class="h5" th:text="${favorite.foodLocation.name}">
                            Food Location
                        </h2>

                        <span class="badge text-bg-success mb-3" th:text="${favorite.foodLocation.category}">
                            Food Pantry
                        </span>

                        <p class="mb-1">

                            <span th:text="${favorite.foodLocation.address}">
                                Address
                            </span>

                        </p>

                        <p class="text-muted">

                            <span th:text="${favorite.foodLocation.city}">
                                City
                            </span>,

                            <span th:text="${favorite.foodLocation.state}">
                                IN
                            </span>

                            <span th:text="${favorite.foodLocation.zipCode}">
                                ZIP
                            </span>

                        </p>

                        <p>

                            <strong>Hours:</strong>

                            <span th:text="${favorite.foodLocation.hours}">
                                Hours
                            </span>

                        </p>

                    </div>


                    <div class="card-footer bg-white border-0 pb-3">

                        <a th:href="@{/locations/{id}(id=${favorite.foodLocation.id})}"
                            class="btn btn-outline-success btn-sm">

                            View Details

                        </a>


                        <form th:action="@{/favorites/{id}/remove(id=${favorite.foodLocation.id})}" method="post"
                            class="d-inline">

                            <button type="submit" class="btn btn-outline-danger btn-sm">

                                Remove

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
