<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Indiana Food Locator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar navbar-expand-lg border-bottom bg-white">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                Indiana Food Locator
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/login}">
                    Login
                </a>
            </div>

        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h1 class="h3 mb-2">
                            Create an Account
                        </h1>

                        <p class="text-muted mb-4">
                            Register to save your favorite food assistance locations.
                        </p>

                        <div th:if="${registrationError != null}" class="alert alert-danger"
                            th:text="${registrationError}">
                        </div>

                        <form th:action="@{/register}" th:object="${user}" method="post" id="registrationForm">

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label for="firstName" class="form-label">
                                        First Name
                                    </label>

                                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control"
                                        required>

                                </div>

                                <div class="col-md-6">

                                    <label for="lastName" class="form-label">
                                        Last Name
                                    </label>

                                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control"
                                        required>

                                </div>

                                <div class="col-12">

                                    <label for="email" class="form-label">
                                        Email
                                    </label>

                                    <input type="email" id="email" th:field="*{email}" class="form-control" required>

                                </div>

                                <div class="col-12">

                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input type="password" id="password" th:field="*{password}" class="form-control"
                                        minlength="8" required>

                                    <div class="form-text">
                                        Use at least 8 characters.
                                    </div>

                                </div>

                                <div class="col-12">

                                    <label for="confirmPassword" class="form-label">
                                        Confirm Password
                                    </label>

                                    <input type="password" id="confirmPassword" class="form-control" minlength="8"
                                        required>

                                    <div id="passwordError" class="text-danger small mt-1 d-none">
                                        Passwords do not match.
                                    </div>

                                </div>

                                <div class="col-12 mt-4">

                                    <button type="submit" class="btn btn-success w-100">
                                        Create Account
                                    </button>

                                </div>

                            </div>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account?

                            <a th:href="@{/login}">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script>
        const form = document.getElementById("registrationForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const passwordError = document.getElementById("passwordError");

        form.addEventListener("submit", function (event) {

            if (password.value !== confirmPassword.value) {
                event.preventDefault();
                passwordError.classList.remove("d-none");
                confirmPassword.focus();
            } else {
                passwordError.classList.add("d-none");
            }
        });
    </script>

</body>

</html>
