<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Indiana Food Locator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar navbar-expand-lg border-bottom bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                Indiana Food Locator
            </a>

        </div>

    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-2">
                            Welcome Back
                        </h1>

                        <p class="text-muted text-center mb-4">
                            Sign in to access your saved food locations.
                        </p>

                        <div th:if="${param.error}" class="alert alert-danger">
                            Invalid email or password.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success">
                            You have been logged out.
                        </div>

                        <div th:if="${param.registered}" class="alert alert-success">
                            Your account was created successfully. You can now log in.
                        </div>

                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">

                                <label for="username" class="form-label">
                                    Email
                                </label>

                                <input type="email" id="username" name="username" class="form-control"
                                    autocomplete="email" required>

                            </div>

                            <div class="mb-4">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" name="password" class="form-control"
                                    autocomplete="current-password" required>

                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Login
                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            Don't have an account?

                            <a th:href="@{/register}">
                                Create one
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
