<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Indiana Food Locator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar navbar-expand-lg border-bottom bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                Indiana Food Locator
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/locations}">
                            Search
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">

                        <a class="nav-link" th:href="@{/favorites}">
                            Favorites
                        </a>

                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}">
                            Contact
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link" th:href="@{/admin/locations}">
                            Admin
                        </a>

                    </li>

                    <li class="nav-item ms-lg-3" sec:authorize="isAnonymous()">

                        <a class="btn btn-outline-success" th:href="@{/login}">
                            Login
                        </a>

                    </li>

                    <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated()">

                        <form th:action="@{/logout}" method="post">

                            <button type="submit" class="btn btn-outline-secondary">
                                Logout
                            </button>

                        </form>

                    </li>

                </ul>


            </div>

        </div>

    </nav>


    <main>

        <!-- Contact Hero -->
        <section class="contact-hero">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-lg-8 text-center">

                        <h1 class="display-5 fw-bold">
                            Contact Us
                        </h1>

                        <p class="lead mt-3">
                            Have a question, suggestion, or resource update?
                            Send us a message.
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- Contact Form -->
        <section class="py-5">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-lg-7">

                        <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}">
                        </div>


                        <div class="card shadow-sm">

                            <div class="card-body p-4">

                                <h2 class="h4 mb-4">
                                    Send a Message
                                </h2>


                                <form th:action="@{/contact}" method="post">

                                    <div class="mb-3">

                                        <label for="name" class="form-label">

                                            Name

                                        </label>

                                        <input type="text" id="name" name="name" class="form-control" required>

                                    </div>


                                    <div class="mb-3">

                                        <label for="email" class="form-label">

                                            Email

                                        </label>

                                        <input type="email" id="email" name="email" class="form-control" required>

                                    </div>


                                    <div class="mb-3">

                                        <label for="subject" class="form-label">

                                            Subject

                                        </label>

                                        <input type="text" id="subject" name="subject" class="form-control" required>

                                    </div>


                                    <div class="mb-4">

                                        <label for="message" class="form-label">

                                            Message

                                        </label>

                                        <textarea id="message" name="message" class="form-control" rows="6" required>
                                    </textarea>

                                    </div>


                                    <button type="submit" class="btn btn-success">

                                        Send Message

                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="home-footer">

        <div class="container text-center">

            <p class="mb-1 fw-semibold">
                Indiana Food Locator
            </p>

            <p class="small mb-0">
                Helping Indiana residents connect with food assistance resources.
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
